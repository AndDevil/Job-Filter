name: Run Job Aggregator Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 8:00 AM UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install dependencies from requirements.txt
        pip install -r requirements.txt

    - name: Run pipeline
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        JOBSPY_PROXY: ${{ secrets.JOBSPY_PROXY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python job_pipeline.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: scraped-jobs
        path: |
          relevant_jobs.csv
          all_jobs_combined.csv
        retention-days: 30

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Checkout master to avoid detached HEAD
        git checkout master
        
        # Force add generated CSVs and history folder (which are ignored by local gitignore)
        git add -f relevant_jobs.csv all_jobs_combined.csv job_history/
        
        # Commit and push only if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update scraped jobs and alert logs [skip ci]"
          git push origin master
        else
          echo "No changes to commit."
        fi
